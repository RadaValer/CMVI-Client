<!doctype html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegiul „Mihai Viteazul” Ineu</title>
  <meta name="description" content="Site-ul Colegiului „Mihai Viteazul” Ineu: noutăți, orar, supliniri, profesori și contact.">
  <link rel="icon" type="image/png" href="assets/sigla.png">
  <link rel="apple-touch-icon" href="assets/sigla.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // set the theme before first paint
    (function () {
      var p = 'light'; // default theme when the visitor has not chosen one
      try { p = localStorage.getItem('cmv-theme') || 'light'; } catch (e) {}
      var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body class="booting">
  <!-- the four frame rectangles: always on screen, re-positioned per page -->
  <div class="lens no-anim" aria-hidden="true">
    <div class="lens-rect r-tr"></div>
    <div class="lens-rect r-bl"></div>
    <div class="lens-rect r-br"></div>
    <div class="lens-rect r-tl"></div>
  </div>

  <div class="splash" aria-hidden="true">
    <svg class="mark m-tl" viewBox="0 0 96 60"><use href="#mark"/></svg>
    <svg class="mark m-tr" viewBox="0 0 96 60"><use href="#mark"/></svg>
    <svg class="mark m-br" viewBox="0 0 96 60"><use href="#mark"/></svg>
    <svg class="mark m-bl" viewBox="0 0 96 60"><use href="#mark"/></svg>
    <p class="splash-title">Colegiul “Mihai Viteazul” Ineu</p>
  </div>

  <header class="topbar">
    <nav class="nav" aria-label="Navigare principală">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Meniu">
        <span></span><span></span><span></span>
      </button>
      <span class="nav-current"></span>
      <div class="nav-links">
        <a href="#/despre" data-route="despre">Despre</a>
        <a href="#/noutati" data-route="noutati">Noutăți</a>
        <a href="#/orar" data-route="orar">Orar</a>
        <a href="#/supliniri" data-route="supliniri">Supliniri</a>
        <a href="#/profesori" data-route="profesori">Profesori</a>
        <a href="#/contact" data-route="contact">Contact</a>
        <div class="nav-more">
          <span class="nav-more-btn">Altele</span>
          <!-- second bar, shown under the main one while hovering "Altele"; items are placeholders -->
          <div class="subnav" role="menu">
            <a href="#/harta" role="menuitem" data-route="harta">Hartă</a>
            <a href="#/organizare" role="menuitem" data-route="organizare">Organizare</a>
            <a href="https://sites.google.com/lmvineu.ro/oferta-educationala-cmv" role="menuitem" target="_blank" rel="noopener">Oferta educațională</a>
            <a href="https://sites.google.com/lmvineu.ro/inv-dual-cmv/acas%C4%83" role="menuitem" target="_blank" rel="noopener">Învățământ dual</a>
            <a href="https://sites.google.com/lmvineu.ro/european-projects/home" role="menuitem" target="_blank" rel="noopener">Proiecte europene</a>
            <a href="https://sites.google.com/lmvineu.ro/inscriere-clasa0/home" role="menuitem" target="_blank" rel="noopener">Înscriere clasa pregătitoare</a>
            <a href="https://sites.google.com/lmvineu.ro/smartlab/home" role="menuitem" target="_blank" rel="noopener">Smartlab CMV</a>
            <a href="https://sites.google.com/lmvineu.ro/documente-cmv/peo_primul-student" role="menuitem" target="_blank" rel="noopener">PEO Primul student</a>
          </div>
        </div>
      </div>
    </nav>
    <a class="userbtn" href="#/cont" data-route="cont" aria-label="Contul meu">
      <svg viewBox="0 0 32 32" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="16" cy="16" r="14"/><circle cx="16" cy="12.5" r="4.6"/>
        <path d="M6.8 26.2c1.6-4 5-6.2 9.2-6.2s7.6 2.2 9.2 6.2"/>
      </svg>
    </a>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="lightbox" hidden>
    <button class="lb-arrow lb-prev" type="button" aria-label="Imaginea anterioară">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <figure class="lb-figure">
      <img class="lb-img" alt="">
      <a class="btn-grad lb-download" download>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        <span>Descarcă</span>
      </a>
    </figure>
    <button class="lb-arrow lb-next" type="button" aria-label="Imaginea următoare">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 96 60">
      <rect x="0" y="0" width="96" height="14" rx="4"/><rect x="0" y="0" width="15" height="60" rx="4"/>
      <rect x="23" y="23" width="15" height="14" rx="4.5"/><rect x="42" y="23" width="36" height="14" rx="5"/>
    </symbol>
  </svg>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/format.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
